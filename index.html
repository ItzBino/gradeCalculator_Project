<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Grade Calculator Project">
    <meta name="author" content="Bino M B">
    <meta name="keywords" content="grade,marks,average">
    <title>Grade Calculator</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h3>Grade Calculator Online</h3>
    </div>

    <form action="" id="grade-calculator">
        <div class="input-container">
            <div class="grade-input">
                <label for="Subject-1">Subject-1</label>
                <input type="number" id="Subject-1"  required>
            </div>
            <div class="grade-input">
                <label for="Subject-2">Subject-2</label>
                <input type="number" id="Subject-2" required>
            </div>
            <div class="grade-input">
                <label for="Subject-3">Subject-3</label>
                <input type="number" id="Subject-3" required>
            </div>
            <div class="grade-input">
                <label for="Subject-4">Subject-4</label>
                <input type="number" id="Subject-4" required>
            </div>
            <div class="grade-input">
                <label for="Subject-5">Subject-5</label>
                <input type="number" id="Subject-5" required>
            </div>
            <div class="button">
                <button type="submit">Calculate</button>
            </div>
        </div>
    </form>
    
    <script src="/javascript/script.js"></script>
</body>
</html>
